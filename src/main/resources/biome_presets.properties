# Optional biome presets. The mechanism is implemented; contents are intentionally
# empty until the preset definitions are provided.
#
# Format:
#   preset.<key>.label=<display label>
#   preset.<key>.biomes=<comma-separated biome ids or English biome names>
#
# Example:
#   preset.ocean.label=海洋类
#   preset.ocean.biomes=ocean,deep_ocean,frozen_ocean,...
